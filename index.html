<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shuttle Mate — Supabase Sync</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1320;
      --panel: #111d2d;
      --panel-2: #15273d;
      --text: #eaf2ff;
      --muted: #9bb2d0;
      --brand: #3ea5ff;
      --brand-2: #7ec8ff;
      --ok: #2dd4bf;
      --warn: #ffb703;
      --danger: #ff5b5b;
      --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #0a1020, #111d2d);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
    }
    .card {
      background: rgba(17, 29, 45, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    h1, h2, h3 { margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
    }
    input { outline: none; }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(62,165,255,0.2);
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #0a1020;
      font-weight: 700;
      border: none;
      transition: transform 0.12s ease;
    }
    button.secondary {
      background: #223955;
      color: var(--text);
    }
    button.danger { background: linear-gradient(135deg, #ff7b54, #ff4d4d); color: white; }
    button:hover { transform: translateY(-1px); }
    .row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .status {
      padding: 10px 12px;
      background: rgba(46, 204, 113, 0.08);
      border: 1px solid rgba(46, 204, 113, 0.22);
      color: var(--text);
      border-radius: 10px;
      margin-top: 10px;
      font-size: 13px;
    }
    .status.error {
      background: rgba(255, 91, 91, 0.08);
      border-color: rgba(255, 91, 91, 0.22);
    }
    .status.syncing {
      background: rgba(255, 183, 3, 0.08);
      border-color: rgba(255, 183, 3, 0.22);
    }
    ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Shuttle Mate — Cloud Sync</h1>
      <div class="grid">
        <div>
          <label for="supabaseUrl">Supabase URL</label>
          <input id="supabaseUrl" type="text" placeholder="https://xxx.supabase.co" />
        </div>
        <div>
          <label for="supabaseAnonKey">Anon / Publishable Key</label>
          <input id="supabaseAnonKey" type="password" placeholder="anon key" />
        </div>
        <div>
          <label for="spaceName">Space</label>
          <input id="spaceName" type="text" value="badminton" />
        </div>
      </div>
      <div class="row" style="margin-top: 16px;">
        <button type="button" id="connectBtn">Connect</button>
        <button type="button" class="secondary" id="loadBtn">Load from cloud</button>
        <button type="button" class="secondary" id="saveBtn">Save to cloud</button>
      </div>
      <div id="status" class="status">Not connected yet.</div>
    </div>

    <div class="card">
      <h2>Players</h2>
      <div class="row">
        <input id="playerInput" type="text" placeholder="Add player name" />
        <button type="button" id="addPlayerBtn">Add player</button>
      </div>
      <ul id="playerList"></ul>
    </div>

    <div class="card">
      <h2>Sessions</h2>
      <div class="row">
        <input id="sessionInput" type="date" />
        <button type="button" id="addSessionBtn">Add session</button>
      </div>
      <ul id="sessionList"></ul>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'shuttle_mate_full_state_v1';
    const CLOUD_TABLE = 'shuttle_mate_state';
    let cloudSyncTimer = null;

    window.SHUTTLE_CONFIG = {
      supabaseUrl: '',
      supabaseAnonKey: '',
      space: 'badminton'
    };

    window.supabaseClient = null;

    const state = {
      players: ['Dev', 'Gagan', 'Mayank', 'Neeraj', 'Nirav', 'Sachin'],
      sessions: [
        { id: 1, date: new Date().toISOString().slice(0, 10), notes: 'Initial session' }
      ]
    };

    const els = {
      status: document.getElementById('status'),
      playerList: document.getElementById('playerList'),
      sessionList: document.getElementById('sessionList'),
      playerInput: document.getElementById('playerInput'),
      sessionInput: document.getElementById('sessionInput'),
      supabaseUrl: document.getElementById('supabaseUrl'),
      supabaseAnonKey: document.getElementById('supabaseAnonKey'),
      spaceName: document.getElementById('spaceName')
    };

    function setStatus(message, isError = false, isSyncing = false) {
      els.status.textContent = message;
      els.status.classList.toggle('error', isError);
      els.status.classList.toggle('syncing', isSyncing && !isError);
    }

    function renderLists() {
      els.playerList.innerHTML = '';
      state.players.forEach((name, index) => {
        const li = document.createElement('li');
        li.textContent = `${index + 1}. ${name}`;
        els.playerList.appendChild(li);
      });

      els.sessionList.innerHTML = '';
      state.sessions.forEach((session) => {
        const li = document.createElement('li');
        li.textContent = `${session.date} :: ${session.notes || 'No notes'}`;
        els.sessionList.appendChild(li);
      });
    }

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn('Local save failed', error);
      }
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.players) && Array.isArray(parsed.sessions)) {
          state.players = parsed.players;
          state.sessions = parsed.sessions;
          renderLists();
        }
      } catch (error) {
        console.warn('Local load failed', error);
      }
    }

    function updateConfigFromInputs() {
      window.SHUTTLE_CONFIG.supabaseUrl = els.supabaseUrl.value.trim();
      window.SHUTTLE_CONFIG.supabaseAnonKey = els.supabaseAnonKey.value.trim();
      window.SHUTTLE_CONFIG.space = (els.spaceName.value || 'badminton').trim();
    }

    function initSupabase() {
      updateConfigFromInputs();
      const cfg = window.SHUTTLE_CONFIG;
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        setStatus('Please enter Supabase URL and anon key.', true);
        return null;
      }

      if (!window.supabase || typeof window.supabase.createClient !== 'function') {
        setStatus('Supabase SDK not available.', true);
        return null;
      }

      if (!window.supabaseClient) {
        window.supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      }

      return window.supabaseClient;
    }

    async function cloudSaveState() {
      const client = initSupabase();
      if (!client) return false;

      const payload = {
        space: window.SHUTTLE_CONFIG.space,
        payload: JSON.parse(JSON.stringify(state)),
        updated_at: new Date().toISOString()
      };

      try {
        setStatus(`Syncing to Supabase...`, false, true);
        const { error } = await client
          .from(CLOUD_TABLE)
          .upsert(payload, { onConflict: 'space' });

        if (error) throw error;
        setStatus(`Auto-synced to Supabase for space "${window.SHUTTLE_CONFIG.space}".`);
        saveLocal();
        return true;
      } catch (error) {
        console.error('Supabase save failed:', error);
        setStatus('Supabase sync failed. Check the table and policy permissions.', true);
        return false;
      }
    }

    async function cloudLoadState() {
      const client = initSupabase();
      if (!client) return false;

      try {
        setStatus('Loading cloud state...', false, true);
        const { data, error } = await client
          .from(CLOUD_TABLE)
          .select('payload')
          .eq('space', window.SHUTTLE_CONFIG.space)
          .maybeSingle();

        if (error && error.code !== 'PGRST116') throw error;

        if (!data || !data.payload) {
          setStatus('No cloud state was found for this space yet.');
          return false;
        }

        const merged = data.payload;
        if (Array.isArray(merged.players) && Array.isArray(merged.sessions)) {
          state.players = merged.players;
          state.sessions = merged.sessions;
          renderLists();
          saveLocal();
          setStatus(`Loaded full state for space "${window.SHUTTLE_CONFIG.space}" from Supabase.`);
          return true;
        }

        setStatus('Cloud payload exists but is not a valid ShuttleMate state object.', true);
        return false;
      } catch (error) {
        console.error('Supabase load failed:', error);
        setStatus('Supabase load failed. Check the table and your permissions.', true);
        return false;
      }
    }

    function scheduleCloudSync() {
      updateConfigFromInputs();
      if (!window.SHUTTLE_CONFIG.supabaseUrl || !window.SHUTTLE_CONFIG.supabaseAnonKey) return;
      if (!window.supabaseClient) {
        initSupabase();
      }
      if (!window.supabaseClient) return;

      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(async () => {
        await cloudSaveState();
      }, 800);
    }

    document.getElementById('connectBtn').addEventListener('click', async () => {
      updateConfigFromInputs();
      initSupabase();
      if (window.supabaseClient) {
        setStatus(`Connected to Supabase for space "${window.SHUTTLE_CONFIG.space}".`);
        await cloudLoadState();
        await cloudSaveState();
      }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      await cloudSaveState();
    });

    document.getElementById('loadBtn').addEventListener('click', async () => {
      await cloudLoadState();
    });

    document.getElementById('addPlayerBtn').addEventListener('click', () => {
      const name = document.getElementById('playerInput').value.trim();
      if (!name) return;
      state.players.push(name);
      document.getElementById('playerInput').value = '';
      saveLocal();
      renderLists();
      scheduleCloudSync();
    });

    document.getElementById('addSessionBtn').addEventListener('click', () => {
      const date = document.getElementById('sessionInput').value;
      if (!date) return;
      state.sessions.push({ id: Date.now(), date, notes: 'New session' });
      document.getElementById('sessionInput').value = '';
      saveLocal();
      renderLists();
      scheduleCloudSync();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().slice(0, 10);
      els.sessionInput.value = today;
      loadLocal();
      renderLists();

      const storedUrl = localStorage.getItem('shuttle_supabase_url');
      const storedKey = localStorage.getItem('shuttle_supabase_key');
      const storedSpace = localStorage.getItem('shuttle_supabase_space');

      if (storedUrl) els.supabaseUrl.value = storedUrl;
      if (storedKey) els.supabaseAnonKey.value = storedKey;
      if (storedSpace) els.spaceName.value = storedSpace;

      updateConfigFromInputs();
      if (window.SHUTTLE_CONFIG.supabaseUrl && window.SHUTTLE_CONFIG.supabaseAnonKey) {
        initSupabase();
        void cloudLoadState();
      }
    });

    window.addEventListener('beforeunload', () => {
      updateConfigFromInputs();
      localStorage.setItem('shuttle_supabase_url', window.SHUTTLE_CONFIG.supabaseUrl);
      localStorage.setItem('shuttle_supabase_key', window.SHUTTLE_CONFIG.supabaseAnonKey);
      localStorage.setItem('shuttle_supabase_space', window.SHUTTLE_CONFIG.space);
      if (window.supabaseClient) {
        clearTimeout(cloudSyncTimer);
      }
    });

    renderLists();
  </script>
</body>
</html>

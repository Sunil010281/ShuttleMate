<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShuttleMate Cloud</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #1b2430;
      --muted: #5e7287;
      --line: #dfe8f3;
      --brand: #1768c9;
      --brand-2: #0c4c9a;
      --ok: #128b4b;
      --warn: #d9485f;
      --shadow: 0 10px 30px rgba(18, 41, 71, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: linear-gradient(180deg, #edf4ff 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 18px 48px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin-top: 18px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 2.3vw, 2.5rem);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #eef7f2;
      color: var(--ok);
      border: 1px solid #cfead9;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status.offline {
      background: #fff3f5;
      color: var(--warn);
      border-color: #f5d3d9;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, button {
      font: inherit;
    }
    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 1rem;
    }
    input:focus {
      outline: 3px solid rgba(23, 104, 201, 0.12);
      border-color: var(--brand);
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, var(--brand), var(--brand-2));
      color: white;
      font-weight: 700;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.03); }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: #edf2f9;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.danger {
      background: linear-gradient(180deg, #ef5b78, #d9485f);
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }
    li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcff;
    }
    .muted {
      color: var(--muted);
    }
    .pill {
      font-size: 0.8rem;
      border-radius: 999px;
      background: #eef5ff;
      color: var(--brand);
      padding: 4px 8px;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .compact {
      font-size: 0.92rem;
    }
    .log {
      min-height: 24px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    @media (max-width: 650px) {
      .topbar { align-items: flex-start; }
      .buttons { flex-direction: column; }
      .buttons button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>ShuttleMate Cloud</h1>
      <div id="cloudStatus" class="status offline"><span class="dot"></span> Not connected</div>
    </div>

    <section class="card">
      <div class="grid">
        <div>
          <label for="supabaseUrl">Supabase URL</label>
          <input id="supabaseUrl" type="text" placeholder="https://xxxxx.supabase.co" />
        </div>
        <div>
          <label for="supabaseAnonKey">Anon / Publishable Key</label>
          <input id="supabaseAnonKey" type="text" placeholder="eyJ..." />
        </div>
        <div>
          <label for="space">Space</label>
          <input id="space" type="text" value="badminton" />
        </div>
      </div>
      <div class="buttons">
        <button id="connectBtn" type="button">Connect to Supabase</button>
        <button id="loadBtn" type="button" class="secondary">Load from cloud</button>
        <button id="saveBtn" type="button" class="secondary">Save to cloud</button>
      </div>
      <div id="log" class="log">Use your Supabase URL and anon key to sync the app state.</div>
    </section>

    <section class="card">
      <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
        <h2 style="margin: 0;">Players</h2>
        <span id="playerCount" class="pill">0 players</span>
      </div>
      <div class="row">
        <input id="playerName" type="text" placeholder="Add a player" />
        <button id="addPlayerBtn" type="button">Add player</button>
      </div>
      <ul id="playerList" style="margin-top: 14px;"></ul>
    </section>

    <section class="card">
      <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
        <h2 style="margin: 0;">Sessions</h2>
        <span id="sessionCount" class="pill">0 sessions</span>
      </div>
      <div class="row">
        <input id="sessionDate" type="date" />
        <button id="addSessionBtn" type="button">Add session</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Players</th>
            <th>Pairs</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="sessionTableBody"></tbody>
      </table>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const DEFAULT_SPACE = 'badminton';
    const appState = {
      players: ['Dev', 'Gagan', 'Mayank', 'Nirav', 'Sunil', 'Sunny'],
      sessions: []
    };

    const config = window.SHUTTLE_CONFIG || {
      supabaseUrl: '',
      supabaseAnonKey: '',
      space: DEFAULT_SPACE
    };

    const els = {
      cloudStatus: document.getElementById('cloudStatus'),
      supabaseUrl: document.getElementById('supabaseUrl'),
      supabaseAnonKey: document.getElementById('supabaseAnonKey'),
      space: document.getElementById('space'),
      log: document.getElementById('log'),
      playerName: document.getElementById('playerName'),
      playerList: document.getElementById('playerList'),
      playerCount: document.getElementById('playerCount'),
      sessionDate: document.getElementById('sessionDate'),
      sessionTableBody: document.getElementById('sessionTableBody'),
      sessionCount: document.getElementById('sessionCount')
    };

    let supabaseClient = null;

    function setLog(msg) {
      els.log.textContent = msg;
    }

    function setCloudStatus(connected) {
      if (connected) {
        els.cloudStatus.classList.remove('offline');
        els.cloudStatus.innerHTML = '<span class="dot"></span> Connected';
      } else {
        els.cloudStatus.classList.add('offline');
        els.cloudStatus.innerHTML = '<span class="dot"></span> Not connected';
      }
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem('shuttlemate_state');
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.players?.length) appState.players = parsed.players;
        if (Array.isArray(parsed.sessions)) appState.sessions = parsed.sessions;
      } catch (error) {
        console.warn('Could not read local state', error);
      }
    }

    function persistLocalState() {
      localStorage.setItem('shuttlemate_state', JSON.stringify(appState));
    }

    function initConfigInputs() {
      els.supabaseUrl.value = config.supabaseUrl || '';
      els.supabaseAnonKey.value = config.supabaseAnonKey || '';
      els.space.value = config.space || DEFAULT_SPACE;
    }

    function ensureSupabaseClient() {
      const url = els.supabaseUrl.value.trim();
      const anonKey = els.supabaseAnonKey.value.trim();
      if (!url || !anonKey) {
        setLog('Enter Supabase URL and anon key first.');
        return null;
      }

      if (!supabaseClient) {
        supabaseClient = window.supabase.createClient(url, anonKey);
      }
      return supabaseClient;
    }

    function renderPlayers() {
      els.playerList.innerHTML = '';
      appState.players.forEach((player, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${player}</span>
          <button class="danger secondary" data-remove-player="${index}" type="button">Remove</button>
        `;
        els.playerList.appendChild(li);
      });
      els.playerCount.textContent = `${appState.players.length} players`;
    }

    function generatePairsForPlayers() {
      const players = [...appState.players];
      if (players.length < 2) return [];
      const shuffled = [...players].sort(() => Math.random() - 0.5);
      const pairs = [];
      for (let i = 0; i < shuffled.length; i += 2) {
        if (i + 1 < shuffled.length) {
          pairs.push([shuffled[i], shuffled[i + 1]]);
        }
      }
      return pairs;
    }

    function renderSessions() {
      els.sessionTableBody.innerHTML = '';
      appState.sessions.forEach((session) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${session.date}</td>
          <td class="compact">${session.players?.join(', ') || '—'}</td>
          <td class="compact">${session.pairs?.length ? session.pairs.map(([a, b]) => `${a} + ${b}`).join('<br>') : 'No pairs yet'}</td>
          <td><button class="secondary" data-generate-pairs="${session.id}" type="button">Generate pairs</button></td>
        `;
        els.sessionTableBody.appendChild(tr);
      });
      els.sessionCount.textContent = `${appState.sessions.length} sessions`;
    }

    function render() {
      renderPlayers();
      renderSessions();
    }

    function addPlayer(name) {
      const trimmed = name.trim();
      if (!trimmed) return;
      if (appState.players.includes(trimmed)) {
        setLog('That player already exists.');
        return;
      }
      appState.players.push(trimmed);
      persistLocalState();
      render();
      setLog(`Player added: ${trimmed}`);
    }

    function removePlayer(index) {
      appState.players.splice(index, 1);
      persistLocalState();
      render();
      setLog('Player removed.');
    }

    function addSession(dateString) {
      const date = dateString || new Date().toISOString().slice(0, 10);
      if (!date) return;
      if (appState.sessions.some((s) => s.date === date)) {
        setLog('A session already exists for that date.');
        return;
      }
      appState.sessions.push({ id: Date.now(), date, players: [...appState.players], pairs: generatePairsForPlayers() });
      persistLocalState();
      render();
      setLog(`Session created for ${date}.`);
    }

    async function connectSupabase() {
      const client = ensureSupabaseClient();
      if (!client) return;

      try {
        const { data, error } = await client.from('app_state').select('space').limit(1);
        if (error) {
          throw error;
        }
        setCloudStatus(true);
        setLog('Supabase connected successfully.');
        config.supabaseUrl = els.supabaseUrl.value.trim();
        config.supabaseAnonKey = els.supabaseAnonKey.value.trim();
        config.space = els.space.value.trim() || DEFAULT_SPACE;
        window.SHUTTLE_CONFIG = { ...config };
      } catch (error) {
        console.error(error);
        setCloudStatus(false);
        setLog('Connection failed. Make sure the table exists and RLS is configured.');
      }
    }

    async function loadFromCloud() {
      const client = ensureSupabaseClient();
      if (!client) return;

      try {
        const { data, error } = await client
          .from('app_state')
          .select('state')
          .eq('space', els.space.value.trim() || DEFAULT_SPACE)
          .maybeSingle();

        if (error && error.code !== 'PGRST116') throw error;

        if (data?.state) {
          appState.players = Array.isArray(data.state.players) ? data.state.players : appState.players;
          appState.sessions = Array.isArray(data.state.sessions) ? data.state.sessions : appState.sessions;
          persistLocalState();
          render();
          setLog('State loaded from Supabase.');
          setCloudStatus(true);
          return;
        }

        setLog('No cloud state found yet. Save the current app state to create it.');
      } catch (error) {
        console.error(error);
        setLog('Could not load cloud state. Check your table and permissions.');
      }
    }

    async function saveToCloud() {
      const client = ensureSupabaseClient();
      if (!client) return;

      try {
        const payload = {
          space: els.space.value.trim() || DEFAULT_SPACE,
          state: {
            players: appState.players,
            sessions: appState.sessions
          },
          updated_at: new Date().toISOString()
        };

        const { error } = await client
          .from('app_state')
          .upsert(payload, { onConflict: 'space' });

        if (error) throw error;

        persistLocalState();
        setCloudStatus(true);
        setLog('State saved to Supabase.');
      } catch (error) {
        console.error(error);
        setLog('Save failed. Confirm the table exists and the key has write access.');
      }
    }

    document.getElementById('connectBtn').addEventListener('click', connectSupabase);
    document.getElementById('loadBtn').addEventListener('click', loadFromCloud);
    document.getElementById('saveBtn').addEventListener('click', saveToCloud);

    document.getElementById('addPlayerBtn').addEventListener('click', () => {
      addPlayer(els.playerName.value);
      els.playerName.value = '';
    });

    document.addEventListener('click', (event) => {
      const removeTarget = event.target.closest('[data-remove-player]');
      if (removeTarget) {
        removePlayer(Number(removeTarget.dataset.removePlayer));
        return;
      }

      const genTarget = event.target.closest('[data-generate-pairs]');
      if (genTarget) {
        const id = Number(genTarget.dataset.generatePairs);
        const session = appState.sessions.find((item) => item.id === id);
        if (!session) return;
        session.pairs = generatePairsForPlayers();
        persistLocalState();
        render();
        setLog(`New pairs generated for ${session.date}.`);
      }
    });

    document.getElementById('addSessionBtn').addEventListener('click', () => {
      addSession(els.sessionDate.value);
      els.sessionDate.value = '';
    });

    initConfigInputs();
    loadLocalState();
    render();
  </script>
</body>
</html>
